# Configuração do Cloudflare Worker do provador ModaClick
name = "modaclick-provador"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites que podem chamar o Worker (separados por vírgula). Troque pelo endereço real do site.
# NÃO use "*". Evite "null" fora de testes (ele vale para qualquer arquivo aberto no computador).
ALLOWED_ORIGINS = "http://localhost:3000"

# A chave NÃO fica aqui. Cadastre como segredo:
#   npx wrangler secret put WESHOP_API_KEY

# (Opcional, recomendado) Limite de 5 provas por minuto por IP:
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 5
#   period = 60
